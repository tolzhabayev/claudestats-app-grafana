services:
  grafana:
    image: grafana/grafana:13.2.4
    container_name: claudestats-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./dist:/var/lib/grafana/plugins/timurdigital-claudestats-app
      - ./provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_DEFAULT_APP_MODE=development
      - GF_LOG_LEVEL=debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=timurdigital-claudestats-app
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  # OpenTelemetry Collector - receives OTLP data from Claude Code
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: claudestats-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  # Prometheus - stores metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: claudestats-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Loki - stores Claude Code events (OTel logs) for the Reliability tab
  loki:
    image: grafana/loki:3.4.2
    container_name: claudestats-loki
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - "3100:3100"
    volumes:
      # local-config.yaml keeps chunks, index, rules and the WAL under /loki
      - loki-data:/loki
    restart: unless-stopped

  # Tempo - stores Claude Code traces (beta) for the Traces tab
  tempo:
    image: grafana/tempo:2.6.1
    container_name: claudestats-tempo
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

volumes:
  grafana-storage:
  prometheus-data:
  loki-data:
  tempo-data:
