# Recommended Grafana alert rules for Claude Code usage.
#
# Grafana loads this file from its provisioning directory (see the plugin docs,
# "Set up alerts"). Before you use it:
# - set `datasourceUid` to the uid of the Prometheus data source with Claude Code metrics;
# - with the Direct OTLP ingestion path, replace `claude_code_cost_usage_USD_total`
#   with `claude_code_cost_usage`.
apiVersion: 1

groups:
  - orgId: 1
    name: Claude Code
    folder: Claude Code
    interval: 5m
    rules:
      - uid: claude-code-cost-spike
        title: Claude Code cost spike per member
        condition: C
        data:
          # Members whose estimated spend over the last hour is above $5 and more
          # than 3x their average hourly spend over the last 7 days. A member is
          # identified like in the app: user_email, else enduser_id, else user_id.
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (
                  sum by (member) (label_replace(label_replace(label_replace(
                    increase(claude_code_cost_usage_USD_total[1h]),
                    "member", "$1", "user_id", "(.+)"), "member", "$1", "enduser_id", "(.+)"), "member", "$1", "user_email", "(.+)"))
                  > 5
                )
                and
                (
                  sum by (member) (label_replace(label_replace(label_replace(
                    increase(claude_code_cost_usage_USD_total[1h]),
                    "member", "$1", "user_id", "(.+)"), "member", "$1", "enduser_id", "(.+)"), "member", "$1", "user_email", "(.+)"))
                  > 3 * sum by (member) (label_replace(label_replace(label_replace(
                    increase(claude_code_cost_usage_USD_total[7d]),
                    "member", "$1", "user_id", "(.+)"), "member", "$1", "enduser_id", "(.+)"), "member", "$1", "user_email", "(.+)")) / 168
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        # No member over the threshold returns no series, which is the normal state.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          app: claude-code
        annotations:
          summary: 'Claude Code cost spike: {{ $labels.member }}'
          description: >-
            {{ $labels.member }} spent about ${{ printf "%.2f" $values.B.Value }} on Claude Code in the
            last hour, more than 3x their average hourly spend over the last 7 days.
